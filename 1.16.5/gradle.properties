org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

minecraft_version=1.16.5
minecraft_version_range=[1.16.5,1.17)
forge_version=36.2.42
forge_version_range=[36,)
loader_version_range=[36,)

# Mojang's own names. Worth the licence click: the whole port is reading vanilla
# code, and MCP names would make every one of those reads a translation too.
mapping_channel=official
mapping_version=1.16.5

# The same id as the 1.12.2 build, on purpose: they are one mod and never run
# side by side, so a player carrying settings between versions keeps them.
# Deliberately not "vulkanmod" — that one belongs to the original mod on 1.17+,
# and colliding with it would be a landmine for the day these meet.
mod_id=vulkanmodnext
mod_name=VulkanMod Next
mod_license=LGPL-3.0-only
mod_version=0.1.0-alpha.1
mod_group_id=net.vulkanmodnext
mod_authors=VLOD-ZDOV
mod_description=Draws the world with Vulkan instead of OpenGL. This is the 1.16.5 build - early, and far behind the 1.12.2 one: the terrain is drawn, the effects are not there yet.
