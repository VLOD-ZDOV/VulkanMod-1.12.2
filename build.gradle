// Compile the GLSL shaders to SPIR-V as part of the build.
//
// They used to be compiled by hand and the .spv committed beside the source,
// which means editing a shader and not remembering the extra step produces a
// build that runs the old one and says nothing. The compiled files stay in the
// tree so that a machine without the Vulkan SDK can still build this, and are
// only rewritten when the source is newer.
tasks.register('compileShaders') {
    def shaderDir = file('src/main/resources/vulkanmod112/shaders')
    inputs.dir shaderDir
    // Deliberately no declared outputs. They would land inside
    // src/main/resources, and Gradle then treats every task that reads the
    // resource tree — sourcesJar among them — as implicitly depending on this
    // one and fails the build for not saying so. Whether a file needs
    // recompiling is decided below by timestamp instead.
    doLast {
        def compiler = ['glslc', 'glslangValidator'].find { name ->
            try {
                def probe = new ProcessBuilder(name, '--version').redirectErrorStream(true).start()
                probe.inputStream.text
                probe.waitFor() == 0
            } catch (IOException ignored) {
                false
            }
        }
        def sources = shaderDir.listFiles().findAll { it.name =~ /\.(vert|frag|comp)$/ }
        if (compiler == null) {
            def stale = sources.findAll {
                def spv = new File(it.parentFile, "${it.name}.spv")
                !spv.exists() || spv.lastModified() < it.lastModified()
            }
            if (stale.isEmpty()) {
                logger.lifecycle 'No shader compiler found; the committed SPIR-V is up to date.'
                return
            }
            throw new GradleException(
                    'No shader compiler on PATH (install glslc or glslangValidator from the ' +
                            'Vulkan SDK) and these shaders changed since their SPIR-V was built: ' +
                            stale.collect { it.name }.join(', '))
        }
        // A second build of the same source, with ray query switched on.
        //
        // It has to be a second module and cannot be a switch inside one: a
        // SPIR-V module that names an acceleration structure asks for a
        // capability the driver either has or refuses the pipeline for, so a
        // card without ray query must never be handed this variant at all. The
        // source is one file either way — the define is inserted after the
        // version line into a copy, so there is no second shader to keep in
        // step with the first.
        def rayQueryVariants = ['terrain.frag']
        def build = { File source, File spv, boolean rayQuery ->
            def input = source
            if (rayQuery) {
                // Two edits to a copy: the define that switches the tracing
                // code on, and the language version. Ray query is specified
                // against GLSL 4.60 and the compiler will not take it below
                // that; the ordinary build stays where it was, so nothing
                // about the shader every card runs changes here.
                def text = source.text
                def marker = text.indexOf('\n', text.indexOf('#version'))
                input = new File(temporaryDir, source.name)
                input.parentFile.mkdirs()
                input.text = '#version 460\n#define RAY_QUERY 1\n' + text.substring(marker + 1)
            }
            // Ray query needs SPIR-V 1.4, and that needs a 1.2 target. The
            // ordinary variants stay on 1.1 so nothing about them changes for
            // a driver that has only that.
            def env = rayQuery ? 'vulkan1.2' : 'vulkan1.1'
            // Assembled by hand into a list of strings: a Groovy list built
            // by concatenation carries GString elements, and ProcessBuilder
            // takes only String.
            def cmd = new ArrayList<String>()
            cmd.add(compiler)
            if (compiler == 'glslc') {
                cmd.add('-O')
                cmd.add('--target-env=' + env)
                if (rayQuery) {
                    cmd.add('--target-spv=spv1.4')
                }
            } else {
                cmd.add('-V')
                cmd.add('--target-env')
                cmd.add(env)
                if (rayQuery) {
                    cmd.add('--target-spv')
                    cmd.add('spv1.4')
                }
            }
            cmd.add(input.absolutePath)
            cmd.add('-o')
            cmd.add(spv.absolutePath)
            def process = new ProcessBuilder(cmd).redirectErrorStream(true).start()
            def output = process.inputStream.text
            if (process.waitFor() != 0) {
                throw new GradleException("Compiling ${spv.name} failed:\n${output}")
            }
            logger.lifecycle "Compiled shader ${spv.name}"
        }
        sources.each { source ->
            def spv = new File(source.parentFile, "${source.name}.spv")
            if (!spv.exists() || spv.lastModified() < source.lastModified()) {
                build(source, spv, false)
            }
            if (rayQueryVariants.contains(source.name)) {
                def rtName = source.name.replaceFirst(/\.(vert|frag|comp)$/, '_rt.$1')
                def rtSpv = new File(source.parentFile, "${rtName}.spv")
                if (!rtSpv.exists() || rtSpv.lastModified() < source.lastModified()) {
                    build(source, rtSpv, true)
                }
            }
        }
    }
}

