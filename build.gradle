// On hybrid-graphics Linux the default OpenGL device can be the integrated
// GPU; route the dev client to the discrete NVIDIA card via PRIME offload
tasks.matching { it.name in ['runClient', 'runObfClient'] }.configureEach {
    environment '__NV_PRIME_RENDER_OFFLOAD', '1'
    environment '__GLX_VENDOR_LIBRARY_NAME', 'nvidia'
    // -PverifyWalk makes the replacement visibility search check every position
    // it derives against the chunk that slot actually holds. It costs the very
    // lookup the search exists to avoid, so it is for confirming correctness,
    // never for timing.
    if (project.hasProperty('verifyWalk')) {
        jvmArgs '-Dvulkanmod112.verifyWalk=true'
    }
    // -PdumpLang writes logs/vulkanmod112-en_us.lang from the settings screen
    // as it is actually built, which is where the English language file comes
    // from. Open the screen once, then copy the file into resources.
    if (project.hasProperty('dumpLang')) {
        jvmArgs '-Dvulkanmod112.dumpLang=true'
    }
    // -Pflight=<route> flies the client by itself: it makes a world from a
    // fixed seed, waits for the chunks around the spawn, flies the named route
    // taking screenshots, marks the diagnostics file at each one and quits.
    // Everything else about the run is a property of its own, and all of them
    // are passed straight through so that a route can be pinned without
    // touching this file: -PflightTag, -PflightSeed, -PflightDistance,
    // -PflightSeconds, -PflightSettle, -PflightShots, -PflightPatience,
    // -PflightPos, -PflightProfiler, -PflightPreset, -PflightHour and
    // -PflightWeather.
    if (project.hasProperty('flight')) {
        jvmArgs '-Dvulkanmod112.flight=' + project.property('flight')
        ['flightTag', 'flightSeed', 'flightDistance', 'flightSeconds',
         'flightSettle', 'flightShots', 'flightPatience', 'flightPos',
         'flightProfiler', 'flightPreset', 'flightHour', 'flightWeather',
         'flightPairs'].each { name ->
            if (project.hasProperty(name)) {
                jvmArgs '-Dvulkanmod112.' + name + '=' + project.property(name)
            }
        }
    }
    // -PfrozenSeconds=N holds the animation clock every effect here reads, so
    // that two frames taken at different moments differ only in what they were
    // taken to compare. Without it a blade of grass has moved between them and
    // every pixel of foliage and water is a difference.
    if (project.hasProperty('frozenSeconds')) {
        jvmArgs '-Dvulkanmod112.frozenSeconds=' + project.property('frozenSeconds')
    }
    // -PforceFallback makes the Vulkan side refuse to start, which is what a
    // player on an unsupported driver gets. It is the only way to see that
    // state on a machine where the renderer works.
    if (project.hasProperty('forceFallback')) {
        jvmArgs '-Dvulkanmod112.forceFallback=true'
    }
    // -PstackSizeKb=N sets the scratch space LWJGL gets per thread. A small
    // value reproduces the startup failure of a machine whose drivers list more
    // extensions than the budget allows; a large one is what a player on such a
    // machine is asked to try.
    if (project.hasProperty('stackSizeKb')) {
        jvmArgs "-Dvulkanmod112.stackSizeKb=${project.property('stackSizeKb')}"
    }
    // -PnoDepthBlit forces the depth path a driver without sampleable D24 gets:
    // D32F targets, depth handed back to GL by the gl_FragDepth composite, and
    // the translucent pass declining every frame. That is what every AMD card
    // runs, so it is not an edge case — it is the other half of the users.
    if (project.hasProperty('noDepthBlit')) {
        jvmArgs '-Dvulkanmod112.depthBlit=false'
    }
    // -PnoInteropSemaphores hands the shared images between the two APIs by
    // making both sides go idle instead of by semaphore. Slow on purpose: it is
    // for drivers that accept an imported semaphore and never signal it, where
    // the alternative is a card the operating system has to reset.
    if (project.hasProperty('noInteropSemaphores')) {
        jvmArgs '-Dvulkanmod112.interopSemaphores=false'
    }
    // -PqueueTransfer=true|false forces the ownership handover of the shared
    // images on or off. It defaults to on for Windows only, so this is how the
    // barriers get exercised on a driver that can report what it thinks of them.
    if (project.hasProperty('queueTransfer')) {
        jvmArgs "-Dvulkanmod112.externalQueueTransfer=${project.property('queueTransfer')}"
    }
    // -PnoReadProbe skips the three reads of the shared memory done at startup
    // before anything depends on them. They are there to name the step that
    // kills a driver that cannot really use the import, so turning them off is
    // for when the probe itself is the thing under suspicion.
    if (project.hasProperty('noReadProbe')) {
        jvmArgs '-Dvulkanmod112.probeImportedRead=false'
    }
    // -PcloseHandlesEarly restores closing each exported Win32 handle the moment
    // the import returns, instead of holding it until the device goes. The pair
    // is how the difference gets measured on a driver that might be storing the
    // handle rather than duplicating what it keeps.
    if (project.hasProperty('closeHandlesEarly')) {
        jvmArgs '-Dvulkanmod112.closeHandlesEarly=true'
    }
    // -Pvalidation turns on the Vulkan validation layer and routes what it
    // finds into the mod's own log. It is how a lost device gets a cause: the
    // call that reports one is never the call that caused it, and the layer is
    // the only thing that sees the illegal command as it is recorded.
    if (project.hasProperty('validation')) {
        jvmArgs '-Dvulkanmod112.validation=true'
    }
    // -PultraLog forces the diagnostics file on whatever the config says. Every
    // measurement run wants it, it is off by default, and a run that produces no
    // file looks the same as a run that failed.
    // -PrayTracing turns on the acceleration structures over the terrain. The
    // setting exists in the screen too; this is here so a measurement run needs
    // no clicking, and because a property given on the command line is pinned
    // and the settings file cannot move it.
    if (project.hasProperty('rayTracing')) {
        jvmArgs '-Dvulkanmod112.rayTracing=true'
    }
    if (project.hasProperty('ultraLog')) {
        jvmArgs '-Dvulkanmod112.ultraLog=true'
    }
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
