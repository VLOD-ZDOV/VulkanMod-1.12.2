String parserChangelog() {
    if (!file('CHANGELOG.md').exists()) {
        throw new GradleException('publish_with_changelog is true, but CHANGELOG.md does not exist in the workspace!')
    }
    String parsedChangelog = changelog.renderItem(
            changelog.get(propertyString('mod_version')).withHeader(false).withEmptySections(false),
            Changelog.OutputType.MARKDOWN)
    if (parsedChangelog.isEmpty()) {
        throw new GradleException('publish_with_changelog is true, but the changelog for the latest version is empty!')
    }
    return parsedChangelog
}

tasks.register('generateMixinJson') {
    group 'cleanroom helpers'
    def missingConfig = propertyStringList('mixin_configs').findAll(config -> !file("src/main/resources/mixins.${config}.json").exists())
    onlyIf {
        if (propertyBool('use_mixins') && propertyBool('generate_mixins_json')) {
            return !missingConfig.empty
        }
        return false
    }
    doLast {
        for (String mixinConfig : missingConfig) {
            def file = file("src/main/resources/mixins.${mixinConfig}.json")
            file << """{\n\t"package": "",\n\t"required": true,\n\t"refmap": "${propertyString('mixin_refmap')}",\n\t"target": "@env(DEFAULT)",\n\t"minVersion": "0.8.5",\n\t"compatibilityLevel": "JAVA_8",\n\t"mixins": [],\n\t"server": [],\n\t"client": []\n}"""
        }
    }
}

/**
 * Every mixin listed in a config has to be filed under a patch group.
 *
 * A group is what the settings screen can switch off, and VulkanPatchGroups
 * files anything it does not recognise under "core", which is never switched
 * off. That is the safe way to be wrong, but it is silently wrong: a new mixin
 * added and not filed would simply never be switchable, and nobody would find
 * out until somebody needed to turn its feature off and could not. So the two
 * lists are compared here rather than trusted to stay in step.
 */
tasks.register('verifyPatchGroups') {
    group 'verification'
    description 'Checks that every mixin in a config is filed under a patch group.'
    def configs = fileTree('src/main/resources').matching { include 'mixins.vulkanmod112*.json' }
    def table = file('src/main/java/net/vulkanmod112/core/VulkanPatchGroups.java')
    inputs.files configs
    inputs.file table
    doLast {
        def filed = (table.text =~ /"([A-Za-z0-9_]+(?:Mixin|Accessor))"/).collect { it[1] } as Set
        def listed = [] as Set
        configs.each { config ->
            listed.addAll((config.text =~ /"([A-Za-z0-9_$.]+(?:Mixin|Accessor))"/).collect { it[1] })
        }
        def unfiled = (listed - filed).toSorted()
        def stale = (filed - listed).toSorted()
        if (!unfiled.isEmpty()) {
            throw new GradleException("Not filed under a patch group in VulkanPatchGroups: ${unfiled.join(', ')}")
        }
        if (!stale.isEmpty()) {
            throw new GradleException("Filed under a patch group but in no mixin config: ${stale.join(', ')}")
        }
    }
}

tasks.named('check').configure { dependsOn 'verifyPatchGroups' }

